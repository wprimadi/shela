version: 2

project_name: shela
builds:
  - main: ./main.go
    binary: shela
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.buildVersion={{.Version}} -X main.buildTime={{.Timestamp}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  github:
    owner: wprimadi
    name: shela
